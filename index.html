<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="SS Dev Studio - Professional Android App Development, Website Development and AI Solutions.">

    <meta name="theme-color"
        content="#07111f">

    <title>
        SS Dev Studio | Apps, Websites & AI Solutions
    </title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #07111f;

            color: #ffffff;

            line-height: 1.6;

            overflow-x: hidden;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        /* =========================================
           VARIABLES
        ========================================= */

        :root {

            --background: #07111f;

            --background-2: #0b1728;

            --card: #101e32;

            --card-light: #13253d;

            --text: #ffffff;

            --text-muted: #aebbd0;

            --blue: #4d8dff;

            --blue-light: #8bb4ff;

            --border:
                rgba(255, 255, 255, 0.10);

        }


        /* =========================================
           HEADER
        ========================================= */

        header {

            position: sticky;

            top: 0;

            z-index: 1000;

            width: 100%;

            background:
                rgba(7, 17, 31, 0.96);

            border-bottom:
                1px solid var(--border);

            backdrop-filter:
                blur(15px);

        }


        .navbar {

            width: 100%;

            max-width: 1250px;

            min-height: 72px;

            margin: auto;

            padding:
                0 25px;

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 20px;

        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            font-size: 21px;

            font-weight: 800;

            white-space: nowrap;

        }


        .brand-icon {

            width: 42px;

            height: 42px;

            border-radius: 11px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    #774dff
                );

            font-weight: 900;

        }


        .nav-links {

            display: flex;

            align-items: center;

            list-style: none;

            gap: 22px;

        }


        .nav-links a {

            color: var(--text-muted);

            font-size: 14px;

            transition: 0.25s;

        }


        .nav-links a:hover {

            color: white;

        }


        /* =========================================
           BUTTONS
        ========================================= */

        .button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                13px 22px;

            border-radius: 10px;

            font-weight: 700;

            border: 1px solid transparent;

            transition:
                transform 0.2s,
                background 0.2s;

        }


        .button:hover {

            transform:
                translateY(-2px);

        }


        .button-primary {

            background:
                linear-gradient(
                    135deg,
                    #4d8dff,
                    #6b63ff
                );

            color: white;

        }


        .button-secondary {

            border:
                1px solid
                rgba(255,255,255,0.18);

            background:
                rgba(255,255,255,0.04);

            color: white;

        }


        .nav-button {

            padding:
                10px 16px;

            font-size: 14px;

            white-space: nowrap;

        }


        /* =========================================
           HERO
        ========================================= */

        .hero {

            min-height: 650px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding:
                100px 20px;

            position: relative;

            overflow: hidden;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(77,141,255,0.22),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(107,99,255,0.18),
                    transparent 30%
                ),

                #07111f;

        }


        .hero-content {

            position: relative;

            z-index: 2;

            max-width: 950px;

        }


        .hero-badge {

            display: inline-block;

            margin-bottom: 22px;

            padding:
                8px 16px;

            border-radius: 30px;

            color: var(--blue-light);

            background:
                rgba(77,141,255,0.10);

            border:
                1px solid
                rgba(77,141,255,0.25);

            font-size: 14px;

        }


        .hero h1 {

            font-size:
                clamp(
                    42px,
                    7vw,
                    82px
                );

            line-height: 1.05;

            letter-spacing: -2px;

            margin-bottom: 25px;

        }


        .hero h1 span {

            background:
                linear-gradient(
                    90deg,
                    #78aaff,
                    #b29cff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color:
                transparent;

        }


        .hero p {

            max-width: 700px;

            margin:
                0 auto 35px;

            color: var(--text-muted);

            font-size: 18px;

        }


        .hero-buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

        }


        /* =========================================
           SECTIONS
        ========================================= */

        section {

            padding:
                90px 20px;

        }


        .section-container {

            max-width: 1150px;

            margin: auto;

        }


        .section-heading {

            text-align: center;

            max-width: 750px;

            margin:
                0 auto 50px;

        }


        .section-heading h2 {

            font-size:
                clamp(
                    32px,
                    5vw,
                    48px
                );

            margin-bottom: 12px;

        }


        .section-heading p {

            color: var(--text-muted);

        }


        /* =========================================
           SERVICES
        ========================================= */

        .services-section {

            background:
                #0a1525;

        }


        .services-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

        }


        .service-card {

            background:
                var(--card);

            border:
                1px solid var(--border);

            border-radius: 18px;

            padding: 28px;

            transition:
                transform 0.25s,
                border-color 0.25s;

        }


        .service-card:hover {

            transform:
                translateY(-6px);

            border-color:
                rgba(77,141,255,0.5);

        }


        .service-number {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 10px;

            margin-bottom: 20px;

            background:
                rgba(77,141,255,0.14);

            color:
                var(--blue-light);

            font-weight: bold;

        }


        .service-card h3 {

            font-size: 20px;

            margin-bottom: 12px;

        }


        .service-card p {

            color:
                var(--text-muted);

            font-size: 14px;

        }


        /* =========================================
           PROJECTS
        ========================================= */

        .projects-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;

        }


        .project-card {

            min-height: 250px;

            padding: 30px;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #13243a,
                    #0b1626
                );

            border:
                1px solid var(--border);

            display: flex;

            flex-direction: column;

            justify-content: space-between;

        }


        .project-tag {

            display: inline-block;

            width: fit-content;

            padding:
                6px 12px;

            border-radius: 20px;

            font-size: 12px;

            color:
                var(--blue-light);

            background:
                rgba(77,141,255,0.12);

            margin-bottom: 18px;

        }


        .project-card h3 {

            font-size: 24px;

            margin-bottom: 12px;

        }


        .project-card p {

            color:
                var(--text-muted);

        }


        /* =========================================
           PRICING
        ========================================= */

        .pricing-section {

            background:
                #0a1525;

        }


        .pricing-title {

            margin-top: 90px;

        }


        .pricing-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;

        }


        .app-pricing-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

        }


        .pricing-card {

            padding: 30px;

            border-radius: 20px;

            background:
                var(--card);

            border:
                1px solid var(--border);

            position: relative;

        }


        .pricing-card.popular {

            border:
                1px solid
                rgba(77,141,255,0.7);

            background:
                linear-gradient(
                    145deg,
                    rgba(77,141,255,0.18),
                    #101e32
                );

        }


        .pricing-label {

            color:
                var(--blue-light);

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 10px;

        }


        .pricing-card h3 {

            font-size: 24px;

            margin-bottom: 15px;

        }


        .price-row {

            padding:
                15px 0;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

        }


        .price-row:last-child {

            border-bottom: none;

        }


        .price-type {

            display: block;

            color:
                var(--text-muted);

            font-size: 13px;

        }


        .price-value {

            display: block;

            margin-top: 4px;

            font-size: 25px;

            font-weight: 800;

            color: white;

        }


        .app-price {

            font-size: 31px;

            font-weight: 800;

            margin:
                15px 0;

            color:
                var(--blue-light);

        }


        .pricing-card ul {

            list-style: none;

            margin:
                22px 0;

        }


        .pricing-card li {

            color:
                var(--text-muted);

            padding:
                8px 0;

            border-bottom:
                1px solid
                rgba(255,255,255,0.06);

            font-size: 14px;

        }


        .pricing-note {

            max-width: 900px;

            margin:
                40px auto 0;

            padding: 20px;

            text-align: center;

            color:
                var(--text-muted);

            background:
                rgba(255,255,255,0.03);

            border:
                1px solid var(--border);

            border-radius: 14px;

        }


        /* =========================================
           REQUEST
        ========================================= */

        .request-section {

            background:

                radial-gradient(
                    circle at center,
                    rgba(77,141,255,0.20),
                    transparent 45%
                ),

                #07111f;

        }


        .request-box {

            max-width: 900px;

            margin: auto;

            text-align: center;

            padding:
                55px 30px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid var(--border);

        }


        .request-box h2 {

            font-size:
                clamp(
                    32px,
                    5vw,
                    48px
                );

            margin-bottom: 15px;

        }


        .request-box p {

            color:
                var(--text-muted);

            max-width: 650px;

            margin:
                0 auto 30px;

        }


        .request-buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;

        }


        /* =========================================
           CONTACT
        ========================================= */

        .contact-grid {

            max-width: 850px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;

        }


        .contact-card {

            padding: 30px;

            text-align: center;

            border-radius: 18px;

            background:
                var(--card);

            border:
                1px solid var(--border);

        }


        .contact-card h3 {

            margin-bottom: 10px;

        }


        .contact-card a {

            color:
                var(--blue-light);

            word-break:
                break-word;

        }


        /* =========================================
           FOOTER
        ========================================= */

        footer {

            padding:
                35px 20px;

            border-top:
                1px solid var(--border);

            background:
                #050c16;

        }


        .footer-content {

            max-width: 1150px;

            margin: auto;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 20px;

            flex-wrap: wrap;

            color:
                var(--text-muted);

        }


        .footer-brand {

            color: white;

            font-weight: 800;

            font-size: 18px;

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media
        (max-width: 1000px) {

            .services-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }


            .app-pricing-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }


        @media
        (max-width: 850px) {

            .nav-links {

                display: none;

            }


            .projects-grid {

                grid-template-columns:
                    1fr;

            }


            .pricing-grid {

                grid-template-columns:
                    1fr;

            }

        }


        @media
        (max-width: 600px) {

            .navbar {

                padding:
                    0 15px;

            }


            .brand {

                font-size: 17px;

            }


            .brand-icon {

                width: 36px;

                height: 36px;

            }


            .nav-button {

                font-size: 12px;

                padding:
                    9px 11px;

            }


            .hero {

                min-height: 580px;

                padding:
                    90px 18px;

            }


            .hero h1 {

                letter-spacing:
                    -1px;

            }


            .hero p {

                font-size: 16px;

            }


            .services-grid {

                grid-template-columns:
                    1fr;

            }


            .app-pricing-grid {

                grid-template-columns:
                    1fr;

            }


            .contact-grid {

                grid-template-columns:
                    1fr;

            }


            .footer-content {

                justify-content:
                    center;

                text-align:
                    center;

            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <nav class="navbar">


            <a href="#home"
                class="brand">

                <div class="brand-icon">
                    SS
                </div>

                SS Dev Studio

            </a>


            <ul class="nav-links">

                <li>
                    <a href="#home">
                        Home
                    </a>
                </li>

                <li>
                    <a href="#services">
                        Services
                    </a>
                </li>

                <li>
                    <a href="#projects">
                        Projects
                    </a>
                </li>

                <li>
                    <a href="#pricing">
                        Pricing
                    </a>
                </li>

                <li>
                    <a href="#contact">
                        Contact
                    </a>
                </li>

            </ul>


            <a href="#request"
                class="button button-primary nav-button">

                Request a Project

            </a>


        </nav>

    </header>



    <main>


        <!-- HERO -->

        <section class="hero"
            id="home">

            <div class="hero-content">


                <div class="hero-badge">

                    Professional Digital Development Solutions

                </div>


                <h1>

                    Turning Ideas Into

                    <br>

                    <span>
                        Powerful Digital Pr
